<!-- Subject: Reset your Blackmon admin dashboard password -->
<!--
  Sent when someone uses "Forgot password?" on the admin sign-in page.
  These are filled in when it's sent:
    {{first_name}}  their first name
    {{reset_url}}   their one-time reset link (expires in 1 hour)
    {{admin_url}}   the dashboard sign-in page
-->
<div style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.55;color:#0B1F3F;max-width:560px">
  <p>Hi {{first_name}},</p>
  <p>We received a request to reset your Blackmon admin dashboard password.</p>

  <p style="margin:24px 0">
    <a href="{{reset_url}}" style="display:inline-block;padding:14px 24px;background:#0B1F3F;color:#ffffff;text-decoration:none;border-radius:10px;font-weight:bold">Choose a new password</a>
  </p>

  <p>The link works once and expires in 1 hour. After that, sign in at <a href="{{admin_url}}" style="color:#1F6FAE">{{admin_url}}</a>.</p>
  <p>If you didn't ask for this, you can ignore this email. Your password won't change.</p>
  <p>Blackmon Tutoring</p>
</div>
